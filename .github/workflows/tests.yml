# Runs the test suite, which includes the guards that stop personal data
# reaching this repository. Those guards are the reason this workflow is
# worth having on a project of this size: a leak is not caught by review.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, not tags: a tag is mutable, so
      # "@v7" is a promise the action's owner can silently rewrite.
      # Dependabot reads the trailing version comment and keeps both the
      # SHA and the comment up to date. CodeQL's actions/unpinned-tag
      # query flags the tag form.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q
