[project]
name = "mail-triage"
version = "0.1.0"
description = "Local-first triage for Apple Mail"
requires-python = ">=3.13"
dependencies = ["click>=8.0.0"]

[project.scripts]
mail-triage = "mail_triage.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_triage"]

# The browser interface's page, stylesheet and script are shipped as package
# data — they are served from the installed package, not from the repo.
[tool.hatch.build.targets.wheel.force-include]
"src/mail_triage/web/static" = "mail_triage/web/static"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = ["pytest>=8.0.0"]
